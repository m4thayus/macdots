#
# ~/.config/tmux/claude.conf
#
# The -f config for the dedicated Claude tmux server (`tmux -L claude`),
# launched by cmux in ~/.bash_aliases. Nothing but Claude and its agent panes
# live here, so the global hooks below are safe to apply unconditionally.

source-file ~/.config/tmux/tmux.conf

# Claude Code splits panes for its agents but never sets a layout, which leaves
# the main pane at ~30% width with the agents in one column. The hook fires on
# both spawn and exit, so the row reflows when an agent finishes too.
set -gw main-pane-height 60%
set-hook -g window-layout-changed 'select-layout main-horizontal'

# Agent panes carry the agent name as their title.
set -g pane-border-status top
set -g pane-border-format " #{pane_title} "

# The outer session already draws one.
set -g status off
