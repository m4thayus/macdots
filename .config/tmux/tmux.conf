#
# ~/.config/tmux/tmux.conf
#
# tmux is only ever the inner multiplexer. zellij is what you launch (dzj in
# ~/.bash_aliases), and tmux runs inside one of its panes: an overmind session,
# and the Claude agent fan-out cmux starts on its own server via claude.conf.
#
# So everything here assumes zellij already draws the outer chrome, one row up.

### tmux-sensible settings
# emacs key bindings in tmux command prompt (prefix + :) are better than
# vi keys, even for vim users
set -g status-keys emacs

# address vim mode switching delay (http://superuser.com/a/252717/65504)
set -s escape-time 0

# increase scrollback buffer size
set -g history-limit 50000

# tmux messages are displayed for 4 seconds
set -g display-time 4000

### Personal Settings
# Use tmux rather than screen to enable proper itlatics
# macOS has an out-of-date ncurses
# Pull latest terminfo from Thomas E. Dickey
# `curl -LO https://invisible-island.net/datafiles/current/terminfo.src.gz && gunzip terminfo.src.gz`
# `/usr/bin/tic -xe tmux,tmux-256color terminfo.src`
# For local install to ~/.terminfo; Use `sudo` for all users
set -g default-terminal "tmux-256color"

# Advertise OSC 8 hyperlink support to the outer terminal (tmux 3.4+, native).
# Alacritty and Ghostty both handle OSC 8, so this holds across either.
# Whether tmux still needs the explicit opt-in is unverified.
set -as terminal-features ",*:hyperlinks"


# Listen for focus events for focus tracking (Claude Code)
set -g focus-events on

# Modify prefix to something more sane
unbind C-b
set -g prefix C-\\

# Press the prefix twice to send it through to a nested session.
bind C-\\ send-prefix

# Add a bind to reload config
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded tmux Config"

# Allow mouse-ful navigation
set -g mouse on

# More sane binds for panes
unbind % # Split vertically
unbind '"' # Split horizontally

bind v split-window -h -c "#{pane_current_path}"
bind h split-window -v -c "#{pane_current_path}"

# Ctrl h/j/k/l and Ctrl p/n are deliberately unbound: zellij holds all five for
# its Move, Pane and Resize modes, so an embedded pane never sees them. Pane
# navigation is prefix o, prefix arrows and the mouse.

# Set vi keys in copy mode
set-window-option -g mode-keys vi
unbind -T copy-mode-vi Space; #Default for begin-selection
unbind -T copy-mode-vi Enter; #Default for copy-selection

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe "pbcopy"

#### COLOUR (Kanagawa Dragon, via the Ghostty palette)

# status bar
# The bar carries the branding and the session name, and nothing else. A date
# and a window list would only repeat zellij's bar one row up.
#
# status-style is set because tmux's default is bg=green, which paints a green
# strip behind everything below and swallows the colours the labels carry.
# bg=default hands the row back to the terminal, so this bar sits on the same
# ground zellij's does.
#
# SYNC: both colours come from zellij's bar in ~/.config/zellij/config.kdl —
# branding blue from format_left, session orange from format_right. The bar
# reads as the same kind of label one row down, which is what says this session
# is embedded rather than another zellij. Change one bar and change the other.
#
# Lowercase, because zellij's own bar shows a Tmux mode. "tmux" is this
# session and "Tmux" is that mode, and the case is what tells them apart.
set-option -g status-style "bg=default,fg=#c5c9c5"
set-option -g status-left "#[fg=#8ba4b0]tmux #[fg=#b6927b][#S] "
set-option -g status-left-length 40
set-option -g status-right ""
set-window-option -g window-status-format ""
set-window-option -g window-status-current-format ""

# pane border
# The idle colour is frame_unselected from
# ~/.config/zellij/themes/kanagawa-dragon.kdl, so an embedded session's quiet
# borders sit at the same weight as the zellij frames drawn around them.
#
# The active border deliberately does not match frame_selected. Both are on
# screen at once, and two yellows would say the same thing, so zellij keeps the
# yellow and tmux takes the foreground white.
set-option -g pane-border-status top
set-option -g pane-border-format " #{pane_current_command} "
set-option -g pane-border-style fg="#625e5a"
set-option -g pane-active-border-style fg="#c5c9c5"

# message text
set-option -g message-style fg=brightred,bg=black

# pane number display
set-option -g display-panes-active-colour blue
set-option -g display-panes-colour brightred

# clock
set-window-option -g clock-mode-colour default
set-window-option -g clock-mode-style 12
