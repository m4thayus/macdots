[env]
TERM = "alacritty"

[font]
size = 14.0

# Mirrors .config/ghostty/config, which carries the reasoning for the pairing.
# Ghostty is primary. Keep the two in step.
[font.normal]
family = "Cascadia Code NF"
style = "SemiLight"

[font.bold]
family = "Cascadia Code NF"
style = "SemiBold"

# The style has to be named: Victor Mono ships Italic (cursive) and Oblique
# (slanted roman) as separate faces, and the default would take the wrong one.
[font.italic]
family = "Victor Mono"
style = "Medium Italic"

# Without this the style falls back to Cascadia and breaks the pairing mid-line.
[font.bold_italic]
family = "Victor Mono"
style = "Bold Italic"

# Alacritty emits neither of these on its own. Ghostty does, natively, so it
# has no equivalent block. Fullscreen and search are left to alacritty's
# macOS defaults, which already match ghostty's.
[[keyboard.bindings]]
chars = "\u001E"
key = "Key6"
mods = "Control"

[[keyboard.bindings]]
chars = "\u001b\r"
key = "Return"
mods = "Shift"

[window]
dynamic_padding = true
startup_mode = "Windowed"

[window.padding]
x = 6
y = 6

[general]
import = ["/Users/matt/.config/alacritty/kanagawa-dragon.toml"]
